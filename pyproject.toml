[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshaai"
version = "0.0.1"
description = "NirikshaAI Python SDK — full-stack observability via OpenTelemetry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["observability", "opentelemetry", "tracing", "metrics", "logs", "apm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  # Core OTEL SDK — always required
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]

[project.optional-dependencies]
# Install all general instrumentations at once
all = [
  "opentelemetry-instrumentation-django>=0.45b0",
  "opentelemetry-instrumentation-flask>=0.45b0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-starlette>=0.45b0",
  "opentelemetry-instrumentation-requests>=0.45b0",
  "opentelemetry-instrumentation-urllib3>=0.45b0",
  "opentelemetry-instrumentation-aiohttp-client>=0.45b0",
  "opentelemetry-instrumentation-grpc>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
  "opentelemetry-instrumentation-psycopg2>=0.45b0",
  "opentelemetry-instrumentation-pymongo>=0.45b0",
  "opentelemetry-instrumentation-redis>=0.45b0",
  "opentelemetry-instrumentation-celery>=0.45b0",
]
# LLM, agent-framework and vector-store instrumentations (opt-in).
# Must stay in sync with _LLM_INSTRUMENTATIONS in nirikshaai/_otel.py —
# tests/test_otel_instrumentations.py enforces this.
llm = [
  # Model providers
  "opentelemetry-instrumentation-openai>=0.27b0",
  "opentelemetry-instrumentation-anthropic>=0.27b0",
  "opentelemetry-instrumentation-bedrock>=0.27b0",
  "opentelemetry-instrumentation-vertexai>=0.27b0",
  "opentelemetry-instrumentation-google-generativeai>=0.27b0",
  "opentelemetry-instrumentation-mistralai>=0.27b0",
  "opentelemetry-instrumentation-cohere>=0.27b0",
  "opentelemetry-instrumentation-groq>=0.27b0",
  "opentelemetry-instrumentation-ollama>=0.27b0",
  "opentelemetry-instrumentation-together>=0.27b0",
  "opentelemetry-instrumentation-replicate>=0.27b0",
  "opentelemetry-instrumentation-watsonx>=0.27b0",
  "opentelemetry-instrumentation-sagemaker>=0.27b0",
  "opentelemetry-instrumentation-transformers>=0.27b0",
  # Agent / orchestration frameworks
  "opentelemetry-instrumentation-langchain>=0.27b0",
  "opentelemetry-instrumentation-llamaindex>=0.27b0",
  "opentelemetry-instrumentation-crewai>=0.27b0",
  "opentelemetry-instrumentation-haystack>=0.27b0",
  "opentelemetry-instrumentation-mcp>=0.27b0",
  "opentelemetry-instrumentation-openai-agents>=0.27b0",
  "opentelemetry-instrumentation-agno>=0.27b0",
  # Agent frameworks OpenLLMetry does not cover — OpenInference (Arize) does.
  # Its attributes are read by the same materialized LLM columns.
  "openinference-instrumentation-autogen>=0.1",
  "openinference-instrumentation-google-adk>=0.1",
  "openinference-instrumentation-dspy>=0.1",
  "openinference-instrumentation-guardrails>=0.1",
  # No 3.9-compatible release, same as crewai and mcp above.
  "openinference-instrumentation-smolagents>=0.1; python_version >= '3.10'",
  # Vector stores
  "opentelemetry-instrumentation-chromadb>=0.27b0",
  "opentelemetry-instrumentation-pinecone>=0.27b0",
  "opentelemetry-instrumentation-qdrant>=0.27b0",
  "opentelemetry-instrumentation-weaviate>=0.27b0",
  "opentelemetry-instrumentation-milvus>=0.27b0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "coverage[toml]>=7.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nirikshaai*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C90",  # mccabe complexity
]
ignore = [
    "S101",  # assert in tests is fine
    "S105",  # hardcoded password — false positives in test fixtures
    "B008",  # FastAPI Depends() calls in function args
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"examples/**" = ["S", "B", "N"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["nirikshaai"]
omit = ["nirikshaai/__pycache__/*"]

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = false

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check nirikshaai/
      - run: mypy nirikshaai/ --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: Vulnerability scan (fail on HIGH or CRITICAL)
        run: pip-audit --skip-editable -f json -o audit.json || true
      - name: Check for HIGH/CRITICAL vulnerabilities
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              with open("audit.json") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(0)
          vulns = data.get("vulnerabilities", []) if isinstance(data, dict) else []
          high = [v for v in vulns if v.get("aliases") or v.get("id")]
          # pip-audit exits non-zero if any vulns; re-check severity
          found = [v for v in vulns]
          if found:
              for v in found:
                  print(f"VULN: {v}")
              sys.exit(1)
          EOF

  branch-gate:
    name: Branch Gate (develop → main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Enforce develop → main only
        run: |
          if [[ "${{ github.head_ref }}" != "develop" ]]; then
            echo "ERROR: Only the 'develop' branch may be merged into 'main'."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi
